version: 2

models:
  - name: rep_sales_funnel_monthly
    description: >
      Monthly sales funnel report. One row per month and funnel step, counting
      deals that reached that step for the first time in that month. The month
      grid is derived from the data range and includes zero rows for steps
      with no arrivals, so the series is gap-free for downstream charting.
    columns:
      - name: month
        description: First day of the reporting month.
        data_tests:
          - not_null
      - name: kpi_name
        description: >
          Step label. Stage labels follow the spelling in the source stages
          table, which differs in casing from the assessment brief.
        data_tests:
          - not_null
      - name: funnel_step
        description: Step identifier, including sub-steps 2.1 and 3.1.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '2.1', '3', '3.1', '4', '5', '6', '7', '8', '9']
      - name: deals_count
        description: >
          Number of deals that first reached this step in this month.
          Zero where no deal arrived.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - funnel_step